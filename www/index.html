<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team 2 Web Server</title>
<link rel="stylesheet" href="/style.css">
<main>
  <img src="/jungle.svg" alt="정글의 나무" width="120" height="120">
  <h1>Team 2 Web Server</h1>
